<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Glass chamber at bottom -->
  <rect x="5" y="14" width="8" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Main barrel/body -->
  <rect x="5" y="6" width="8" height="8" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Hopper top -->
  <ellipse cx="9" cy="6" rx="4.5" ry="1.2" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Crank handle - starts from top, curves right -->
  <path d="M 9 4.5 Q 11 2 13 1.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Wooden knob at end of crank -->
  <circle cx="13.5" cy="1" r="1" fill="currentColor"/>
</svg>