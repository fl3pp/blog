<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Main glass cylinder -->
  <rect x="6" y="4" width="8" height="14" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Dark coffee at bottom (approximately 40% of height) -->
  <rect x="6" y="14" width="8" height="4" fill="currentColor" opacity="0.8"/>

  <!-- Foam in middle (approximately 25% of height) -->
  <rect x="6" y="11" width="8" height="3" fill="currentColor" opacity="0.3"/>

  <!-- Empty space on top (approximately 35% of height) -->
  <!-- (no fill needed) -->

  <!-- Handle on right side -->
  <path d="M 14 6 Q 17 6 17 10 Q 17 14 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Plunger rod down the middle -->
  <line x1="10" y1="4" x2="10" y2="17" stroke="currentColor" stroke-width="0.8"/>

  <!-- Base/stand -->
  <rect x="5" y="18" width="10" height="1.5" rx="0.3" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Feet -->
  <line x1="6" y1="19.5" x2="6" y2="21" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="19.5" x2="14" y2="21" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
</svg>