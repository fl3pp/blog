<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Top plate -->
  <rect x="5" y="4" width="14" height="1.5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Center post -->
  <line x1="12" y1="5.5" x2="12" y2="8" stroke="currentColor" stroke-width="1"/>

  <!-- Large dial circle -->
  <circle cx="12" cy="13" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <!-- Dial needle/indicator -->
  <line x1="12" y1="13" x2="14.5" y2="10.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Base stand -->
  <path d="M 8 17.5 L 16 17.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Base feet -->
  <line x1="8" y1="17.5" x2="8" y2="19" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16" y1="17.5" x2="16" y2="19" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
</svg>